name: Refresh market pulse

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Fetch market snapshot
        run: python3 scripts/fetch-market-snapshot.py -o docs/data/market-snapshot.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/market-snapshot.json
          git diff --staged --quiet || git commit -m "chore: refresh market pulse snapshot"
          git push
