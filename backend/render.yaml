services:
  - type: web
    name: meridian-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b:free
